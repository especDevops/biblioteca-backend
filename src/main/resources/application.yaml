spring:
  application:
    name: biblioteca
  datasource:
     url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/biblioteca}
     username: ${SPRING_DATASOURCE_USERNAME:postgres}
     password: ${SPRING_DATASOURCE_PASSWORD:postgres}
     driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
app:
  jwt:
    secret: ${JWT_SECRET:FEÇD58D4531F5827E82374S5WD51Ç72D}
    expiration-seconds: 3600

web:
  origensPermitidas: ${WEB_ORIGENS_PERMITIDAS:http://localhost:5173,http://127.0.0.1:5173}
  metodosPermitidos: ${WEB_METODOS_PERMITIDOS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
  credenciaisPermitidas: ${WEB_CREDENCIAIS_PERMITIDAS:true}
  cabecalhosExpostos: ${WEB_CABECALHOS_EXPOSTOS:Authorization,Content-Type,Content-Disposition}